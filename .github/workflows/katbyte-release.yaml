---
# katbyte's release: a v*-katbyte.* tag on master builds the programs, publishes the release page and the ghcr.io image, then updates the Homebrew formula.
# upstream's tags never start it, because they have no -katbyte. part
name: katbyte release
on:
  push:
    tags: ['v*-katbyte.*']
  # the tap formula is built from a tag's source tarball, not from the checkout, so it can be regenerated for any existing tag without a new release
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish the Homebrew formula for, e.g. v0.15.0-katbyte.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/katbyte-tests.yaml

  goreleaser:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # ghcr.io image push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the changelog and version from tag history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x # matches .promu.yml and the builder image in katbyte-tests.yaml
          cache: false
      # dockers_v2 builds a multi-arch manifest with buildx and pushes it in one go, so it needs qemu for the non-native platform, a buildx builder,
      # and a ghcr.io login before running. qemu and the builder each come from Google's mirror of Docker Hub, which does not turn a shared runner
      # away for having pulled too much, and from Docker Hub itself only when the mirror gives nothing
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        id: qemu
        continue-on-error: true
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.qemu.outcome == 'failure'
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        id: buildx
        continue-on-error: true
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        if: steps.buildx.outcome == 'failure'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean --config .katbyte/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: goreleaser
    if: always() && (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: update tap formula (source build)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        # invoked through bash rather than as ./script so a missing execute bit cannot fail the release
        run: bash ./.katbyte/update-homebrew-formula.sh
